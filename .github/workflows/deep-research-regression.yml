name: Deep research safety regression
on:
  pull_request:
    paths:
      - 'source_reader.py'
      - 'free_research.py'
      - 'public_article_reader.py'
      - 'test_public_article_reader.py'
      - 'test_source_reader.py'
      - 'test_free_research.py'
      - '.github/workflows/deep-research-regression.yml'
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run mocked research and security regressions
        env:
          ENABLE_GENERAL_PUBLIC_READER: '0'
        run: python -m unittest -v test_public_article_reader test_source_reader test_free_research
