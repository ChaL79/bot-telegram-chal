name: Gemini integration checks
on:
  push:
    branches:
      - feature/gemini-command-test
  pull_request:
    paths:
      - 'bot.py'
      - 'gemini_extension.py'
      - 'test_gemini_extension.py'
      - 'gemini_memory.py'
      - 'test_gemini_memory.py'
      - '.github/workflows/gemini-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mock-test dependency
        run: python -m pip install httpx==0.27.2
      - name: Python syntax check
        run: python -m py_compile bot.py gemini_extension.py gemini_memory.py test_gemini_extension.py test_gemini_memory.py
      - name: Run Gemini and memory regression tests
        run: python -m unittest -v test_gemini_extension.py test_gemini_memory.py
