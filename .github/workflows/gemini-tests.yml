name: Gemini integration checks
on:
  push:
    branches:
      - feature/gemini-command-test
  pull_request:
    paths:
      - 'bot.py'
      - 'brunei_prayer_times.py'
      - 'test_brunei_prayer_times.py'
      - 'natural_chat.py'
      - 'test_natural_chat.py'
      - 'document_review.py'
      - 'test_document_review.py'
      - 'media_tools.py'
      - 'test_media_tools.py'
      - 'test_telegram_handlers.py'
      - 'memory_notes.py'
      - 'test_memory_notes.py'
      - 'voice_files.py'
      - 'tts_service.py'
      - 'test_tts_service.py'
      - 'test_voice_files.py'
      - 'test_owner_access.py'
      - 'gemini_extension.py'
      - 'test_gemini_extension.py'
      - 'gemini_memory.py'
      - 'test_gemini_memory.py'
      - 'gemini_advanced.py'
      - 'source_recovery.py'
      - 'test_source_recovery.py'
      - 'research_quality.py'
      - 'test_gemini_advanced.py'
      - 'free_research.py'
      - 'test_free_research.py'
      - 'source_reader.py'
      - 'test_universal_deepdive.py'
      - 'test_source_reader.py'
      - '.github/workflows/gemini-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mock-test dependency
        run: python -m pip install httpx==0.27.2 pypdf==7.1.0
      - name: Python syntax check
        run: python -m py_compile document_review.py test_document_review.py bot.py brunei_prayer_times.py test_brunei_prayer_times.py natural_chat.py test_natural_chat.py tts_service.py test_tts_service.py media_tools.py test_media_tools.py test_telegram_handlers.py memory_notes.py test_memory_notes.py voice_files.py test_voice_files.py test_owner_access.py gemini_extension.py gemini_memory.py gemini_advanced.py source_recovery.py test_source_recovery.py research_quality.py free_research.py source_reader.py test_universal_deepdive.py test_gemini_extension.py test_gemini_memory.py test_gemini_advanced.py test_source_recovery.py test_free_research.py test_source_reader.py
      - name: Run Gemini, memory and research regression tests
        run: python -m unittest -v test_universal_deepdive.py test_brunei_prayer_times.py test_natural_chat.py test_tts_service.py test_document_review.py test_media_tools.py test_telegram_handlers.py test_memory_notes.py test_owner_access.py test_voice_files.py test_gemini_extension.py test_gemini_memory.py test_gemini_advanced.py test_free_research.py test_source_reader.py
