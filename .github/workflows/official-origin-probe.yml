name: Official source origin live probe
on:
  pull_request:
    paths:
      - 'official_origin_probe.py'
      - '.github/workflows/official-origin-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile official_origin_probe.py
      - name: Probe verified official endpoints read-only
        env:
          ENABLE_GENERAL_PUBLIC_READER: '1'
        run: python -u official_origin_probe.py
