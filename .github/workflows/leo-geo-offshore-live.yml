name: LEO GEO offshore live acceptance
on:
  pull_request:
    paths:
      - 'free_research.py'
      - 'source_reader.py'
      - 'test_free_research.py'
      - 'test_source_reader.py'
      - '.github/workflows/leo-geo-offshore-live.yml'
permissions:
  contents: read
jobs:
  satellite-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Require two independent topical verified page excerpts
        env:
          ENABLE_GENERAL_PUBLIC_READER: '1'
        run: |
          python - <<'PY'
          import asyncio
          from urllib.parse import urlsplit
          from free_research import public_source_search
          from source_reader import enrich_with_read_excerpts

          question = ("Bandingkan internet satelit LEO dan GEO untuk kapal offshore, "
                      "termasuk latency, kelajuan, liputan, kesan cuaca dan handover. "
                      "Dapatkan petikan HTML sebenar daripada dua domain bebas.")
          async def main():
              found = await public_source_search(question)
              print("DISCOVERED_COUNT", len(found), flush=True)
              for item in found:
                  print("DISCOVERED", urlsplit(item["url"]).hostname,
                        item.get("title", "")[:90], flush=True)
              enriched = await enrich_with_read_excerpts(question, found)
              verified = [item for item in enriched
                          if item.get("read_status") == "verified_page_excerpt"
                          and bool(item.get("excerpt"))]
              for item in enriched:
                  print("READ_STATUS", item.get("read_status"),
                        urlsplit(item.get("url", "")).hostname,
                        item.get("title", "")[:90], flush=True)
              topical = []
              for item in verified:
                  words = (item.get("title", "") + " " + item.get("excerpt", "")).casefold()
                  # Match the subject, not a generic latency networking definition.
                  if (("leo" in words or "geo" in words or "low earth orbit" in words
                       or "geostationary" in words)
                      and ("satellite" in words or "satelit" in words
                           or "orbit" in words)):
                      topical.append(item)
              hosts = {urlsplit(item["url"]).hostname.removeprefix("www.")
                       for item in topical}
              print("TOPICAL_VERIFIED_HOSTS", sorted(hosts), flush=True)
              assert len(hosts) >= 2, (
                  "FAIL: fewer than 2 independent real LEO/GEO satellite "
                  "HTML excerpts. Do not merge/deploy.")
          asyncio.run(main())
          PY
