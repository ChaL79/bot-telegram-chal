name: LEO GEO offshore live acceptance
on:
  pull_request:
    paths:
      - 'free_research.py'
      - 'source_reader.py'
      - 'test_free_research.py'
      - 'test_source_reader.py'
      - '.github/workflows/leo-geo-offshore-live.yml'
permissions:
  contents: read
jobs:
  satellite-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Diagnose no-key public search before acceptance (read-only)
        run: |
          python - <<'PY'
          import asyncio
          import httpx
          from free_research import parse_rss, search_query_terms, source_relevance
          from urllib.parse import urlsplit
          samples = [
              ("topic_orbits", "LEO GEO satellite maritime connectivity"),
              ("orbit_full_names", "low earth orbit geostationary satellite maritime"),
              ("ship_coverage", "satellite broadband offshore vessels GEO LEO"),
              ("comparison", "LEO vs GEO satellite latency coverage handover"),
              ("anchor_satellite", "satellite communication maritime offshore"),
              ("anchor_network", "satellite internet geostationary maritime"),
              ("anchor_satellite_orbits", "satellite orbit geostationary low earth"),
              ("anchor_satellite_leo_geo", "satellite LEO GEO maritime"),
              ("anchor_vsat", "VSAT maritime offshore satellite connectivity"),
              ("anchor_geo", "geostationary satellite maritime communications"),
              ("anchor_leo", "satellite constellation maritime broadband"),
              ("anchor_marine", "maritime satellite internet latency"),
              ("anchor_geo_leo_expanded", "satellite network orbit altitude latency maritime"),
              ("anchor_multiorbit", "satellite multi orbit maritime connectivity"),
          ]
          async def probe(label, q):
              try:
                  async with httpx.AsyncClient(timeout=8, follow_redirects=False) as c:
                      r = await c.get("https://www.bing.com/search",
                                      params={"q": q, "format":"rss","mkt":"en-US"})
                  hits = parse_rss(r.content,"diagnostic",10) if r.status_code==200 else []
                  print("PROBE_RSS",label,"HTTP",r.status_code,"BYTES",len(r.content),
                        "HITS",len(hits),flush=True)
                  for h in hits[:5]:
                      print("PROBE_RESULT",label,urlsplit(h["url"]).hostname,
                            h.get("title","")[:100],flush=True)
              except Exception as exc:
                  print("PROBE_RSS",label,"ERROR",type(exc).__name__,flush=True)
          async def alternative(label,url,params):
              try:
                  async with httpx.AsyncClient(timeout=8,follow_redirects=False) as c:
                      r=await c.get(url,params=params,headers={"User-Agent":"Mozilla/5.0"})
                  body=r.text[:150000]
                  print("PROBE_ALT",label,"HTTP",r.status_code,"BYTES",len(r.content),
                        "LEO",body.casefold().count("leo"),"GEO",body.casefold().count("geo"),
                        "SATELLITE",body.casefold().count("satellite"),flush=True)
              except Exception as exc:
                  print("PROBE_ALT",label,"ERROR",type(exc).__name__,flush=True)
          async def main():
              await asyncio.gather(
                  *(probe(label,q) for label,q in samples),
                  alternative("ddg_html","https://html.duckduckgo.com/html/",
                              {"q":"LEO GEO satellite maritime connectivity"}),
                  alternative("mojeek","https://www.mojeek.com/search",
                              {"q":"LEO GEO satellite maritime connectivity"}),
                  alternative("google_html","https://www.google.com/search",
                              {"q":"LEO GEO satellite maritime connectivity"}),
              )
          asyncio.run(main())
          PY
      - name: Inspect Google HTML outbound article links without fetching them
        run: |
          python - <<'PY'
          import asyncio, html, re
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit, parse_qs, unquote
          import httpx
          from public_article_reader import safe_public_article_url
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="a":
                      href=dict(attrs).get("href","")
                      if href:
                          self.links.append(html.unescape(href))
          async def main():
              queries=["LEO GEO satellite maritime connectivity",
                       "geostationary low earth orbit offshore satellite internet",
                       "satellite marine handover rain fade latency"]
              async with httpx.AsyncClient(timeout=9,follow_redirects=False) as cli:
                  for q in queries:
                      try:
                          resp=await cli.get("https://www.google.com/search",
                              params={"q":q,"num":"15"},headers={"User-Agent":"Mozilla/5.0"})
                      except httpx.HTTPError as exc:
                          print("GOOGLE_DIAG_ERROR",type(exc).__name__,flush=True)
                          continue
                      parser=Links()
                      parser.feed(resp.text[:300000])
                      out=[]
                      for raw in parser.links:
                          u=raw
                          if raw.startswith("/url?"):
                              u=parse_qs(urlsplit(raw).query).get("q",[""])[0]
                          elif raw.startswith("/"):
                              continue
                          host=urlsplit(u).hostname or ""
                          if host.endswith("google.com") or host.endswith("googleusercontent.com"):
                              continue
                          if safe_public_article_url(u) and u not in out:
                              out.append(u)
                      print("GOOGLE_LINKS",resp.status_code,"ANCHORS",len(parser.links),
                            "SAFE_ARTICLE_LINKS",len(out),flush=True)
                      for url in out[:12]:
                          print("GOOGLE_LINK",urlsplit(url).hostname,
                                urlsplit(url).path[:130],flush=True)
          asyncio.run(main())
          PY
      - name: Probe independent free documented discovery endpoints
        run: |
          python - <<'PY'
          import asyncio, httpx
          from urllib.parse import urlsplit
          from free_research import parse_rss
          probes = [
            ("bing_news", "https://www.bing.com/news/search", {"q":"satellite LEO GEO maritime offshore connectivity","format":"rss"}),
            ("google_news", "https://news.google.com/rss/search", {"q":"LEO GEO satellite maritime broadband","hl":"en-US","gl":"US","ceid":"US:en"}),
            ("gdelt_doc", "https://api.gdeltproject.org/api/v2/doc/doc", {"query":"satellite maritime","mode":"ArtList","format":"json","maxrecords":"10"}),
            ("wikipedia_search", "https://en.wikipedia.org/w/api.php", {"action":"query","list":"search","srsearch":"satellite internet low earth orbit geostationary","srlimit":"8","format":"json"}),
            ("wikipedia_extlinks", "https://en.wikipedia.org/w/api.php", {"action":"query","generator":"search","gsrsearch":"satellite internet constellation","gsrlimit":"3","prop":"extlinks","ellimit":"30","format":"json"}),
            ("crossref", "https://api.crossref.org/works", {"query":"LEO GEO satellite maritime communications","rows":"5"}),
          ]
          async def run(tag,url,params):
            try:
              async with httpx.AsyncClient(timeout=10,follow_redirects=False,headers={"User-Agent":"ChaL79Bot/1.4 public research probe"}) as c:
                r=await c.get(url,params=params)
              ct=r.headers.get("content-type","")
              print("FREE_PROBE",tag,r.status_code,ct[:60],len(r.content),flush=True)
              if "rss" in ct or "xml" in ct:
                found=parse_rss(r.content,tag,10)
                for v in found[:6]:print("FREE_RSS",tag,urlsplit(v["url"]).hostname,v["title"][:85],flush=True)
              elif "json" in ct:
                data=r.json()
                if tag=="gdelt_doc":
                  for v in data.get("articles",[])[:8]:print("FREE_GDELT",urlsplit(v.get("url","")).hostname,v.get("title","")[:85],flush=True)
                elif tag=="wikipedia_search":
                  for v in data.get("query",{}).get("search",[])[:8]:print("FREE_WIKI",v.get("title",""),flush=True)
                elif tag=="wikipedia_extlinks":
                  for v in data.get("query",{}).get("pages",{}).values():
                    urls=[x.get("*","") for x in v.get("extlinks",[])]
                    print("FREE_WIKI_EXT",v.get("title",""),len(urls),[urlsplit(u).hostname for u in urls[:12]],flush=True)
              else:
                print("FREE_BODY",tag,repr(r.text[:120]),flush=True)
            except Exception as e:
              print("FREE_ERROR",tag,type(e).__name__,str(e)[:100],flush=True)
          async def main():await asyncio.gather(*(run(*p) for p in probes))
          asyncio.run(main())
          PY
      - name: Probe discovered encyclopedia citations with the safe HTML reader
        run: |
          python - <<'PY'
          import asyncio, httpx
          from urllib.parse import urlsplit
          from public_article_reader import safe_public_article_url, read_public_html
          from source_reader import MainText, BoundedBodyText, select_relevant_excerpt
          topics=("Satellite Internet access","Low Earth orbit","Geostationary orbit",
                  "Communications satellite","Satellite internet constellation")
          q="LEO GEO satellite maritime offshore latency weather handover broadband"
          async def main():
              async with httpx.AsyncClient(timeout=12) as client:
                  r=await client.get("https://en.wikipedia.org/w/api.php",params={
                      "action":"query","titles":"|".join(topics),"prop":"extlinks",
                      "ellimit":"100","format":"json"})
              print("CITE_API",r.status_code,flush=True)
              entries=[]
              for page in r.json().get("query",{}).get("pages",{}).values():
                  for item in page.get("extlinks",[]):
                      url=item.get("*") or item.get("url") or ""
                      if safe_public_article_url(url) and url not in entries:
                          entries.append(url)
              print("CITE_DISCOVERED",len(entries),flush=True)
              found=[]
              for url in entries[:50]:
                  html=await read_public_html(url)
                  if not html:continue
                  parser=MainText();parser.feed(html)
                  content=parser.content()
                  if not content:
                      other=BoundedBodyText();other.feed(html);content=other.content()
                  excerpt=select_relevant_excerpt(content,q)
                  if excerpt and len(excerpt)>65:
                      print("CITE_READABLE",urlsplit(url).hostname,urlsplit(url).path[:110],
                            "EXCERPT_LEN",len(excerpt),
                            "PREVIEW",repr(excerpt[:95]),flush=True)
                      found.append(url)
                      if len(found)>=5:break
              print("CITE_READABLE_TOTAL",len(found),flush=True)
          asyncio.run(main())
          PY
      - name: Require two independent topical verified page excerpts
        env:
          ENABLE_GENERAL_PUBLIC_READER: '1'
        run: |
          python - <<'PY'
          import asyncio
          from urllib.parse import urlsplit
          from free_research import public_source_search
          from source_reader import enrich_with_read_excerpts

          question = ("Bandingkan internet satelit LEO dan GEO untuk kapal offshore, "
                      "termasuk latency, kelajuan, liputan, kesan cuaca dan handover. "
                      "Dapatkan petikan HTML sebenar daripada dua domain bebas.")
          async def main():
              found = await public_source_search(question)
              print("DISCOVERED_COUNT", len(found), flush=True)
              for item in found:
                  print("DISCOVERED", urlsplit(item["url"]).hostname,
                        item.get("title", "")[:90], flush=True)
              enriched = await enrich_with_read_excerpts(question, found)
              verified = [item for item in enriched
                          if item.get("read_status") == "verified_page_excerpt"
                          and bool(item.get("excerpt"))]
              for item in enriched:
                  print("READ_STATUS", item.get("read_status"),
                        urlsplit(item.get("url", "")).hostname,
                        item.get("title", "")[:90], flush=True)
              topical = []
              for item in verified:
                  words = (item.get("title", "") + " " + item.get("excerpt", "")).casefold()
                  # Match the subject, not a generic latency networking definition.
                  if (("leo" in words or "geo" in words or "low earth orbit" in words
                       or "geostationary" in words)
                      and ("satellite" in words or "satelit" in words
                           or "orbit" in words)):
                      topical.append(item)
              hosts = {urlsplit(item["url"]).hostname.removeprefix("www.")
                       for item in topical}
              print("TOPICAL_VERIFIED_HOSTS", sorted(hosts), flush=True)
              assert len(hosts) >= 2, (
                  "FAIL: fewer than 2 independent real LEO/GEO satellite "
                  "HTML excerpts. Do not merge/deploy.")
          asyncio.run(main())
          PY
