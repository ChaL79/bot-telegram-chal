name: LEO GEO offshore live acceptance
on:
  pull_request:
    paths:
      - 'free_research.py'
      - 'source_reader.py'
      - 'test_free_research.py'
      - 'test_source_reader.py'
      - '.github/workflows/leo-geo-offshore-live.yml'
permissions:
  contents: read
jobs:
  satellite-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Diagnose no-key public search before acceptance (read-only)
        run: |
          python - <<'PY'
          import asyncio
          import httpx
          from free_research import parse_rss, search_query_terms, source_relevance
          from urllib.parse import urlsplit
          samples = [
              ("topic_orbits", "LEO GEO satellite maritime connectivity"),
              ("orbit_full_names", "low earth orbit geostationary satellite maritime"),
              ("ship_coverage", "satellite broadband offshore vessels GEO LEO"),
              ("comparison", "LEO vs GEO satellite latency coverage handover"),
          ]
          async def probe(label, q):
              try:
                  async with httpx.AsyncClient(timeout=8, follow_redirects=False) as c:
                      r = await c.get("https://www.bing.com/search",
                                      params={"q": q, "format":"rss","mkt":"en-US"})
                  hits = parse_rss(r.content,"diagnostic",10) if r.status_code==200 else []
                  print("PROBE_RSS",label,"HTTP",r.status_code,"BYTES",len(r.content),
                        "HITS",len(hits),flush=True)
                  for h in hits[:5]:
                      print("PROBE_RESULT",label,urlsplit(h["url"]).hostname,
                            h.get("title","")[:100],flush=True)
              except Exception as exc:
                  print("PROBE_RSS",label,"ERROR",type(exc).__name__,flush=True)
          async def alternative(label,url,params):
              try:
                  async with httpx.AsyncClient(timeout=8,follow_redirects=False) as c:
                      r=await c.get(url,params=params,headers={"User-Agent":"Mozilla/5.0"})
                  body=r.text[:150000]
                  print("PROBE_ALT",label,"HTTP",r.status_code,"BYTES",len(r.content),
                        "LEO",body.casefold().count("leo"),"GEO",body.casefold().count("geo"),
                        "SATELLITE",body.casefold().count("satellite"),flush=True)
              except Exception as exc:
                  print("PROBE_ALT",label,"ERROR",type(exc).__name__,flush=True)
          async def main():
              await asyncio.gather(
                  *(probe(label,q) for label,q in samples),
                  alternative("ddg_html","https://html.duckduckgo.com/html/",
                              {"q":"LEO GEO satellite maritime connectivity"}),
                  alternative("mojeek","https://www.mojeek.com/search",
                              {"q":"LEO GEO satellite maritime connectivity"}),
                  alternative("google_html","https://www.google.com/search",
                              {"q":"LEO GEO satellite maritime connectivity"}),
              )
          asyncio.run(main())
          PY
      - name: Require two independent topical verified page excerpts
        env:
          ENABLE_GENERAL_PUBLIC_READER: '1'
        run: |
          python - <<'PY'
          import asyncio
          from urllib.parse import urlsplit
          from free_research import public_source_search
          from source_reader import enrich_with_read_excerpts

          question = ("Bandingkan internet satelit LEO dan GEO untuk kapal offshore, "
                      "termasuk latency, kelajuan, liputan, kesan cuaca dan handover. "
                      "Dapatkan petikan HTML sebenar daripada dua domain bebas.")
          async def main():
              found = await public_source_search(question)
              print("DISCOVERED_COUNT", len(found), flush=True)
              for item in found:
                  print("DISCOVERED", urlsplit(item["url"]).hostname,
                        item.get("title", "")[:90], flush=True)
              enriched = await enrich_with_read_excerpts(question, found)
              verified = [item for item in enriched
                          if item.get("read_status") == "verified_page_excerpt"
                          and bool(item.get("excerpt"))]
              for item in enriched:
                  print("READ_STATUS", item.get("read_status"),
                        urlsplit(item.get("url", "")).hostname,
                        item.get("title", "")[:90], flush=True)
              topical = []
              for item in verified:
                  words = (item.get("title", "") + " " + item.get("excerpt", "")).casefold()
                  # Match the subject, not a generic latency networking definition.
                  if (("leo" in words or "geo" in words or "low earth orbit" in words
                       or "geostationary" in words)
                      and ("satellite" in words or "satelit" in words
                           or "orbit" in words)):
                      topical.append(item)
              hosts = {urlsplit(item["url"]).hostname.removeprefix("www.")
                       for item in topical}
              print("TOPICAL_VERIFIED_HOSTS", sorted(hosts), flush=True)
              assert len(hosts) >= 2, (
                  "FAIL: fewer than 2 independent real LEO/GEO satellite "
                  "HTML excerpts. Do not merge/deploy.")
          asyncio.run(main())
          PY
