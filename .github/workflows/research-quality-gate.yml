name: Research quality gate checks
on:
  pull_request:
    paths:
      - 'research_quality.py'
      - 'source_recovery.py'
      - 'test_source_recovery.py'
      - 'test_research_quality.py'
      - 'gemini_advanced.py'
      - '.github/workflows/research-quality-gate.yml'
permissions:
  contents: read
jobs:
  quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: python -m pip install httpx==0.27.2 pypdf==7.1.0
      - name: Compile changed modules
        run: python -m py_compile research_quality.py test_research_quality.py source_recovery.py test_source_recovery.py gemini_advanced.py
      - name: Run research quality and existing research tests
        env:
          ENABLE_GENERAL_PUBLIC_READER: '0'
        run: python -m unittest -v test_research_quality test_source_recovery test_gemini_advanced test_universal_deepdive
