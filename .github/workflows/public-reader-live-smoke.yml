name: Public reader real HTTPS smoke
on:
  pull_request:
    paths:
      - 'public_article_reader.py'
      - 'test_public_article_reader_live.py'
      - '.github/workflows/public-reader-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-https-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUN_NETWORK_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Real DNS TLS smoke
        run: python -m unittest -v test_public_article_reader_live
